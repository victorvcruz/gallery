services:
  gallery:
    build: .
    ports:
      - "${GALLERY_PORT:-3000}:3000"
    volumes:
      # Your photos — mounted read-only so the app can never touch the originals.
      # Set PHOTOS_PATH in .env (or the environment) to point at your library.
      - ${PHOTOS_PATH:-./photos}:/photos:ro
      # Cache lives on a named volume outside the photos tree; needed because
      # /photos is read-only and thumbnails/previews are written on demand.
      - gallery-cache:/cache
    environment:
      - GALLERY_ROOT=/photos
      - GALLERY_CACHE_DIR=/cache
    restart: unless-stopped

volumes:
  gallery-cache:
